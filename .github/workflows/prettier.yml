name: Prettier code formatter

# Disabled to avoid recurring formatting-only CI failures for a personal website.
# The site build itself is unaffected; keep formatting local if desired.
on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Skip formatter check
        run: echo "Prettier check disabled. Format locally with 'npx prettier . --write' if needed."
